[project]
name = "speed-to-lead-agent"
version = "0.1.0"
description = "Open-source AI agent that qualifies and responds to inbound leads in seconds. Multi-agent (LangGraph), a fine-tuned intent classifier, and a real GTM integration layer — bring your own keys."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Omate Labs" }]
keywords = ["ai-agent", "langgraph", "speed-to-lead", "lead-scoring", "fastapi", "mcp", "gtm"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.45",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# LLM drafting — provider-agnostic. Optional: demo mode runs without it.
llm = ["litellm>=1.52"]
# Expose the pipeline's tools as an MCP server (Claude / Cursor / any MCP client).
mcp = ["mcp>=1.2"]
# The fine-tune stack. Heavy; only needed to (re)train the classifier.
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "mlflow>=2.17",
]
# Async queue worker + vector store.
infra = ["redis>=5.1", "faiss-cpu>=1.9"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/Omate-AI/speed-to-lead-agent"

[project.scripts]
speed-to-lead = "speed_to_lead.cli:main"
speed-to-lead-mcp = "speed_to_lead.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speed_to_lead"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["speed_to_lead"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "litellm", "faiss", "mlflow.*", "datasets", "peft", "transformers.*", "mcp.*",
    "torch", "torch.*", "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The MCP tool decorator comes from an optional dep we don't type-check.
module = "speed_to_lead.mcp_server.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
